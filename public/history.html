<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#16001d;color:#fff;font-family:system-ui}.card{background:#211026;border:1px solid #4a3150}.hide{display:none}.purple{background:#6840ff}@media print{header,main>div:first-child,button{display:none!important}body{background:#fff;color:#111}.card{background:#fff;border:1px solid #ddd;color:#111}}</style></head><body>
<header class="bg-[#16001d] border-b border-purple-900 px-4 py-3 flex justify-between"><b>Order မှတ်တမ်း / ပြေစာ</b><a href="/" class="text-xs border border-purple-700 rounded-lg px-3 py-2">Home</a></header>
<main class="max-w-md mx-auto p-4">
<div class="card rounded-2xl p-4"><b>Order ရှာရန်</b><div class="grid grid-cols-2 gap-2 mt-3"><input id="order" placeholder="Order ID" class="bg-[#120b16] border border-purple-900 rounded-xl p-3"><input id="user" placeholder="User ID" class="bg-[#120b16] border border-purple-900 rounded-xl p-3"></div><button onclick="find()" class="w-full purple rounded-xl py-3 mt-2 font-bold">ရှာမည်</button></div>
<div id="result" class="hide mt-4"></div></main>
<script>
const q=new URLSearchParams(location.search);if(q.get('order')){$('order').value=q.get('order');$('user').value=q.get('user')||'';find()}
function $(x){return document.getElementById(x)}
function money(x){return Number(x).toLocaleString()+' Ks'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const labels={PENDING_PAYMENT:['ငွေပေးချေမှု မပြီးသေးပါ','text-yellow-300'],PAYMENT_SUBMITTED:['Payment စစ်ဆေးရန် စောင့်နေပါသည်','text-yellow-300'],PROCESSING:['Top-Up လုပ်ဆောင်နေပါသည်','text-blue-300'],COMPLETED:['Top-Up ပြီးပါပြီ','text-emerald-300'],REJECTED:['Order ပယ်ဖျက်ထားပါသည်','text-rose-300']};
async function find(){let o=$('order').value.trim(),u=$('user').value.trim();if(!o||!u)return alert('Order ID နှင့် User ID ထည့်ပါ');let r=await fetch('/api/order/'+encodeURIComponent(o)+'?userId='+encodeURIComponent(u)),d=await r.json();if(!d.success)return alert(d.error);show(d.order)}
function show(o){let l=labels[o.status]||[o.status,''];$('result').classList.remove('hide');$('result').innerHTML=`<div class="card rounded-2xl p-4"><div class="flex justify-between"><b>Order #${esc(o.order_no)}</b><span class="${l[1]} font-bold">${l[0]}</span></div><hr class="border-purple-900 my-3"><div class="grid gap-2 text-sm"><div>IGN: <b>${esc(o.ign)}</b></div><div>User ID: <b>${esc(o.user_id)} (${esc(o.zone_id)})</b></div><div>Package: <b>${esc(o.package_name)}</b></div><div>Amount: <b>${money(o.price)}</b></div><div>Payment: <b>${esc(o.payment_method)}</b></div><div>Reference: <b>${esc(o.payment_ref||'-')}</b></div><div>Created: ${esc(o.created_at)}</div>${o.admin_note?`<div>Admin Note: ${esc(o.admin_note)}</div>`:''}${o.status==='COMPLETED'?`<div class="mt-3 rounded-xl bg-emerald-950/60 p-4"><div class="text-emerald-300 font-black">✓ Top-Up Completed</div><div class="mt-2">Receipt No: <b>${esc(o.receipt_no)}</b></div><div>Completed: ${esc(o.completed_at||'')}</div><button onclick="printR()" class="mt-3 bg-white text-black rounded-lg px-4 py-2 font-bold">ပြေစာ Print</button></div>`:''}</div></div>`}
function printR(){window.print()}
setInterval(()=>{if($('order').value&&$('user').value)find()},8000);
</script></body></html>
