<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Diamond Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
    <h1 class="text-2xl font-bold text-cyan-400 mb-4 text-center">MLBB Diamond Top-Up</h1>
    <form id="orderForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">Player ID</label>
        <input type="text" id="playerId" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white" placeholder="12345678" required>
      </div>
      <div>
        <label class="block text-sm mb-1">Zone ID</label>
        <input type="text" id="zoneId" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white" placeholder="1234" required>
      </div>
      <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 font-bold py-2 rounded text-slate-900">Order Now</button>
    </form>
  </div>
</body>
</html>
