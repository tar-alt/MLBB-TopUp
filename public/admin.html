<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLBB Admin</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#080b12;color:#fff;font-family:system-ui}.card{background:#101622;border:1px solid #253047}.hide{display:none}.ok{color:#4ade80}.warn{color:#facc15}.bad{color:#fb7185}.blue{color:#60a5fa}</style></head><body>
<header class="sticky top-0 bg-[#080b12] border-b border-slate-800 p-4 flex justify-between"><b>MLBB ADMIN</b><button onclick="load()" class="bg-slate-800 px-3 py-2 rounded-lg text-xs">Refresh</button></header>
<main class="max-w-6xl mx-auto p-4">
<div id="login" class="max-w-sm mx-auto card rounded-2xl p-5 mt-10"><h2 class="font-bold mb-3">Admin Login</h2><input id="pw" type="password" placeholder="Password" class="w-full bg-black border border-slate-700 rounded-xl p-3"><button onclick="login()" class="w-full bg-violet-600 rounded-xl p-3 mt-2 font-bold">Login</button></div>
<div id="app" class="hide">
<div class="grid md:grid-cols-3 gap-4">
<div class="card rounded-2xl p-4"><b>Settings</b><input id="storeName" placeholder="Store Name" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><input id="kpay" placeholder="KPay" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><input id="wave" placeholder="WavePay" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><textarea id="notice" placeholder="Notice" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"></textarea><input id="support" placeholder="Support" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><button onclick="saveSettings()" class="w-full bg-slate-700 rounded-lg p-2 mt-2">Save Settings</button></div>
<div class="card rounded-2xl p-4"><b>Add Package</b><input id="pn" placeholder="Package Name" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><input id="pp" type="number" placeholder="Price" class="w-full bg-black border border-slate-700 rounded-lg p-2 mt-2"><button onclick="addPkg()" class="w-full bg-violet-600 rounded-lg p-2 mt-2">Add</button><div id="pkgList" class="mt-3 space-y-2"></div></div>
<div class="card rounded-2xl p-4"><b>Summary</b><div id="sum" class="mt-3 text-sm"></div></div></div>
<div class="card rounded-2xl p-4 mt-4 overflow-x-auto"><b>Orders</b><table class="w-full text-xs mt-3"><thead><tr class="text-slate-400 border-b border-slate-800"><th class="p-2">Order</th><th class="p-2">Player</th><th class="p-2">Package</th><th class="p-2">Payment</th><th class="p-2">Status</th><th class="p-2">Action</th></tr></thead><tbody id="orders"></tbody></table></div></div></main>
<script>
let token=localStorage.mlbbAdmin||'';
const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}),d=await r.json();if(!d.success)return alert(d.error);token=d.token;localStorage.mlbbAdmin=token;open()}
function open(){$('login').classList.add('hide');$('app').classList.remove('hide');load()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};let r=await fetch(url,opt);if(r.status===401){localStorage.removeItem('mlbbAdmin');location.reload()}return r.json()}
async function load(){if(!token)return;let i=await fetch('/api/initial-data').then(r=>r.json());let s=i.settings||{};$('storeName').value=s.storeName||'';$('kpay').value=s.kpay||'';$('wave').value=s.wave||'';$('notice').value=s.notice||'';$('support').value=s.support||'';$('pkgList').innerHTML=(i.packages||[]).map(p=>`<div class="flex justify-between border-b border-slate-800 py-2"><span>${esc(p.name)}<br><small>${Number(p.price).toLocaleString()} Ks</small></span><button onclick="delPkg(${p.id})" class="text-rose-400">Delete</button></div>`).join('');let d=await api('/api/admin/orders'),os=d.orders||[];$('sum').innerHTML=`Total: <b>${os.length}</b><br>Pending Payment: ${os.filter(x=>x.status==='PENDING_PAYMENT').length}<br>Payment Submitted: ${os.filter(x=>x.status==='PAYMENT_SUBMITTED').length}<br>Processing: ${os.filter(x=>x.status==='PROCESSING').length}<br>Completed: ${os.filter(x=>x.status==='COMPLETED').length}`;$('orders').innerHTML=os.map(o=>`<tr class="border-b border-slate-900"><td class="p-2"><b>${esc(o.order_no)}</b><br><small>${esc(o.created_at)}</small></td><td class="p-2">${esc(o.ign)}<br>${esc(o.user_id)} (${esc(o.zone_id)})</td><td class="p-2">${esc(o.package_name)}<br><b>${Number(o.price).toLocaleString()} Ks</b></td><td class="p-2">${esc(o.payment_method)}<br>${esc(o.payment_number||'')}<br>Ref: <b>${esc(o.payment_ref||'-')}</b></td><td class="p-2">${esc(o.status)}${o.receipt_no?`<br>Receipt: ${esc(o.receipt_no)}`:''}</td><td class="p-2"><div class="flex flex-wrap gap-1">${['PAYMENT_SUBMITTED','PROCESSING','COMPLETED','REJECTED'].map(st=>`<button onclick="status(${o.id},'${st}')" class="px-2 py-1 rounded bg-slate-700">${st}</button>`).join('')}</div></td></tr>`).join('')}
async function status(id,st){let note=st==='COMPLETED'?'Top-Up completed by admin':prompt('Admin note','')||'';await api('/api/admin/order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,status:st,note})});load()}
async function saveSettings(){await api('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeName:$('storeName').value,kpay:$('kpay').value,wave:$('wave').value,notice:$('notice').value,support:$('support').value})});alert('Saved')}
async function addPkg(){await api('/api/admin/package',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pn').value,price:$('pp').value})});$('pn').value='';$('pp').value='';load()}
async function delPkg(id){if(confirm('Delete package?')){await api('/api/admin/package/'+id,{method:'DELETE'});load()}}
if(token)open()
</script></body></html>
